name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, análise estática, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # A imagem oficial já traz os módulos contrib; a migration cria a extensão btree_gist
      # (o usuário abaixo é superusuário do banco de testes).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependências do frontend
        run: npm ci

      # Mesmo banco e credenciais do phpunit.xml: host 127.0.0.1, banco erp_test.
      - name: Ambiente de testes
        run: cp .env.testing .env

      - name: Extensão btree_gist disponível
        run: psql "postgresql://erp:secret@127.0.0.1:5432/erp_test" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist"

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan (nível 9)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Migrations
        run: php artisan migrate --force

      - name: Pest
        run: ./vendor/bin/pest

      - name: Type-check
        run: npm run type-check

      - name: Vitest
        run: npm run test:unit

      - name: Build do frontend
        run: npm run build

  docker-smoke-test:
    name: Imagem de produção (build e smoke test)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: erp_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -f docker/production/Dockerfile -t erp-frotacarga:ci .

      # Rede do host: o contêiner alcança o Postgres do CI em 127.0.0.1:5432 e publica a aplicação em :8080.
      # O Postgres do CI não usa TLS, por isso DB_SSLMODE=disable (em produção a imagem exige `require`).
      - name: Sobe o contêiner
        run: |
          docker run -d --name erp --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:8080 \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_DATABASE=erp_smoke \
            -e DB_USERNAME=erp -e DB_PASSWORD=secret -e DB_SSLMODE=disable \
            erp-frotacarga:ci

      - name: Aguarda Nginx e PHP-FPM
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "A aplicação não respondeu em 60 segundos." >&2
          exit 1

      - name: Migrations
        run: docker exec erp php artisan migrate --force

      - name: Health check responde 200 com o banco no ar
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee health.json
          grep -q '"database":"up"' health.json

      # Exercita o caminho completo: Nginx -> PHP-FPM -> Laravel -> PostgreSQL (limite de tentativas no cache e auditoria no banco).
      - name: API recusa login inválido com 422
        run: |
          status=$(curl -s -o login.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"email":"ninguem@erp.test","password":"errada"}')
          cat login.json
          test "$status" = "422"

      # Em produção a documentação só existe com SCRAMBLE_ENABLED=true; sem ela, /docs/api não pode vazar nem cair no SPA.
      - name: Documentação da API desligada por padrão
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/docs/api)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/docs/api.json)" = "404"

      - name: SPA e assets compilados são servidos
        run: |
          curl -fsS http://localhost:8080/ -o index.html
          asset=$(grep -o '/build/assets/[^"]*\.js' index.html | head -n 1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://localhost:8080$asset"

      - name: Cabeçalhos de segurança na página, nos assets e nos erros
        run: |
          check() {
            headers=$(curl -s -D - -o /dev/null "$1")
            echo "$headers"
            for h in 'strict-transport-security: max-age=31536000; includeSubDomains' 'x-frame-options: DENY' \
                     'x-content-type-options: nosniff' 'referrer-policy: strict-origin-when-cross-origin' 'permissions-policy: camera=()'; do
              echo "$headers" | tr -d '\r' | grep -iq "^$h" || { echo "Faltou: $h em $1" >&2; exit 1; }
            done
            # Um valor só por cabeçalho (o Nginx descarta os da aplicação) e sem versão de servidor/PHP.
            test "$(echo "$headers" | grep -ic '^x-frame-options:')" = "1"
            ! echo "$headers" | grep -iq '^x-powered-by:'
            ! echo "$headers" | grep -iq '^server: nginx/'
          }
          check http://localhost:8080/
          check "http://localhost:8080$(grep -o '/build/assets/[^"]*\.js' index.html | head -n 1)"
          check http://localhost:8080/.env
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -iq "^content-security-policy: default-src 'self'"

      - name: Arquivos sensíveis e métodos não usados são bloqueados
        run: |
          for path in /.env /.git/config /.htaccess /composer.json /composer.lock /package.json /artisan \
                      /database/database.sqlite /storage/logs/laravel.log /vendor/autoload.php /index.php.bak /.env.example; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $status"
            test "$status" = "404"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X TRACE http://localhost:8080/)" = "405"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X TRACK http://localhost:8080/)" = "405"

      - name: Nenhum processo roda como root
        run: |
          docker exec erp ps -o user,comm
          test -z "$(docker exec erp ps -o user | tail -n +2 | grep -v '^www-data' || true)"

      - name: Configuração insegura impede a subida
        run: |
          key="base64:$(openssl rand -base64 32)"
          ! docker run --rm -e APP_KEY="$key" -e APP_DEBUG=true erp-frotacarga:ci true
          ! docker run --rm -e APP_KEY="curta" erp-frotacarga:ci true
          ! docker run --rm erp-frotacarga:ci true

      - name: Health check responde 503 sem o banco
        run: |
          docker stop "${{ job.services.postgres.id }}"
          status=$(curl -s -o down.json -w '%{http_code}' http://localhost:8080/api/v1/health)
          cat down.json
          test "$status" = "503"

      - name: Logs do contêiner
        if: always()
        run: docker logs erp || true
