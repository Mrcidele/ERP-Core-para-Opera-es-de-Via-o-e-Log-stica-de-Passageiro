expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = UTC

; Contêiner de 512 MB com até 5 processos do PHP-FPM: 5 × 80 MB + opcache cabem com folga.
; As exportações CSV saem em streaming (lazy()), então não precisam de mais memória.
memory_limit = 80M
max_execution_time = 30
max_input_time = 10
max_input_vars = 1000
post_max_size = 2M
upload_max_filesize = 2M
file_uploads = Off
allow_url_include = Off
enable_dl = Off

; O código da imagem não muda em execução: o opcache não precisa conferir os arquivos.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
