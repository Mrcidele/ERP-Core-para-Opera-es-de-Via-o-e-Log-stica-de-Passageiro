expose_php = Off
memory_limit = 256M
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /dev/stderr

; O código da imagem não muda em execução: o opcache não precisa conferir os arquivos.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
