[www]
listen = 127.0.0.1:9000
; Sem isto o PHP-FPM apaga as variáveis do contêiner (DB_HOST, APP_KEY...) antes de rodar a aplicação.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Feito para contêineres pequenos (512 MB no plano gratuito do Render): processos sobem só quando chega
; requisição e saem depois de 10 s ociosos. Com memory_limit de 80 MB, 5 processos cabem com folga.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
; Recicla cada processo depois de 500 requisições (contém vazamento de memória de extensões).
pm.max_requests = 500
; Requisição presa por mais de 60 s é encerrada (mesmo teto do fastcgi_read_timeout do Nginx).
request_terminate_timeout = 60s

; Funções de execução de processos ficam desligadas nas requisições web: a aplicação não as usa,
; e um bug de injeção não vira execução de comandos. O CLI (artisan, composer) não é afetado.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source
php_admin_flag[allow_url_fopen] = off
