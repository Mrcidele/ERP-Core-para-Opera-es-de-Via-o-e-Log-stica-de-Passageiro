# Roda sem root (usuário www-data): por isso pid e arquivos temporários ficam em /tmp e não há `user`.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Limites contra corpo grande e conexões lentas (Slowloris): quem não manda o cabeçalho ou o
    # corpo em 10 s é desconectado, e conexões ociosas não ficam presas ao contêiner.
    client_max_body_size 2m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    send_timeout 30s;
    reset_timedout_connection on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;

        include /etc/nginx/security-headers.conf;

        # Só os métodos que a API usa; TRACE, TRACK, CONNECT e afins recebem 405.
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # Arquivos ocultos (.env, .git...) e de projeto nunca são servidos, mesmo que parem em public/.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|artisan|phpunit\.xml|vite\.config\.\w+)$ {
            return 404;
        }

        location ~* \.(sqlite3?|db|sql|log|bak|old|orig|swp|env|ini|neon|ya?ml|sh)$ {
            return 404;
        }

        location ~* ^/(vendor|storage|bootstrap|database|tests|node_modules)/ {
            return 404;
        }

        # Os arquivos do Vite têm hash no nome: podem ficar em cache indefinidamente.
        location /build/ {
            include /etc/nginx/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 60s;
            # As exportações CSV saem em streaming: sem buffer, o download começa na hora.
            fastcgi_buffering off;

            # A aplicação também envia estes cabeçalhos; o Nginx descarta os dela e põe os seus,
            # para não sair duplicado. A CSP passa, porque só a aplicação a define.
            fastcgi_hide_header X-Powered-By;
            fastcgi_hide_header Strict-Transport-Security;
            fastcgi_hide_header X-Frame-Options;
            fastcgi_hide_header X-Content-Type-Options;
            fastcgi_hide_header Referrer-Policy;
            fastcgi_hide_header Permissions-Policy;
            fastcgi_hide_header Cross-Origin-Opener-Policy;
        }

        # Nenhum outro .php é executável.
        location ~ \.php$ {
            return 404;
        }
    }
}
